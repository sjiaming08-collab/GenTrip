services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gentrip}
      POSTGRES_USER: ${POSTGRES_USER:-gentrip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gentrip}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gentrip}:${POSTGRES_PASSWORD:-gentrip}@postgres:5432/${POSTGRES_DB:-gentrip}
      REDIS_URL: redis://redis:6379/0
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-pro}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      RUNTIME_EXECUTION_MODE: redis_stream
      RUNTIME_QUEUE_MAX_ATTEMPTS: ${RUNTIME_QUEUE_MAX_ATTEMPTS:-3}
      RUNTIME_RUN_DEADLINE_SECONDS: ${RUNTIME_RUN_DEADLINE_SECONDS:-120}
      RUNTIME_TENANT_MAX_ACTIVE_RUNS: ${RUNTIME_TENANT_MAX_ACTIVE_RUNS:-3}
      RUNTIME_QUEUE_DEAD_LETTER_STREAM: ${RUNTIME_QUEUE_DEAD_LETTER_STREAM:-gentrip:plan-runs:dlq}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      TENANT_API_KEYS_JSON: ${TENANT_API_KEYS_JSON:-}
      # Local Compose defaults to the documented anonymous workspace mode.
      # Production must set this false and enable AUTH_ENABLED or API keys.
      ALLOW_INSECURE_TENANT_ID: ${ALLOW_INSECURE_TENANT_ID:-true}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_ACCESS_TOKEN_MINUTES: ${AUTH_ACCESS_TOKEN_MINUTES:-60}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_ALLOW_REGISTRATION: ${AUTH_ALLOW_REGISTRATION:-true}
      AUTH_LOGIN_RATE_LIMIT_ENABLED: ${AUTH_LOGIN_RATE_LIMIT_ENABLED:-true}
      AUTH_LOGIN_MAX_ATTEMPTS: ${AUTH_LOGIN_MAX_ATTEMPTS:-5}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-900}
      TRAVEL_TIME_PROVIDER: ${TRAVEL_TIME_PROVIDER:-mock}
      TRAVEL_TIME_HTTP_URL: ${TRAVEL_TIME_HTTP_URL:-}
      TRAVEL_TIME_TIMEOUT_SEC: ${TRAVEL_TIME_TIMEOUT_SEC:-2}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    command: ["python", "-m", "src.worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gentrip}:${POSTGRES_PASSWORD:-gentrip}@postgres:5432/${POSTGRES_DB:-gentrip}
      REDIS_URL: redis://redis:6379/0
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-pro}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      RUNTIME_EXECUTION_MODE: redis_stream
      RUNTIME_QUEUE_MAX_ATTEMPTS: ${RUNTIME_QUEUE_MAX_ATTEMPTS:-3}
      RUNTIME_RUN_DEADLINE_SECONDS: ${RUNTIME_RUN_DEADLINE_SECONDS:-120}
      RUNTIME_TENANT_MAX_ACTIVE_RUNS: ${RUNTIME_TENANT_MAX_ACTIVE_RUNS:-3}
      RUNTIME_QUEUE_DEAD_LETTER_STREAM: ${RUNTIME_QUEUE_DEAD_LETTER_STREAM:-gentrip:plan-runs:dlq}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      TENANT_API_KEYS_JSON: ${TENANT_API_KEYS_JSON:-}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      TRAVEL_TIME_PROVIDER: ${TRAVEL_TIME_PROVIDER:-mock}
      TRAVEL_TIME_HTTP_URL: ${TRAVEL_TIME_HTTP_URL:-}
      TRAVEL_TIME_TIMEOUT_SEC: ${TRAVEL_TIME_TIMEOUT_SEC:-2}
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./monitoring/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.6.1
    user: "0:0"
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    volumes:
      - ./monitoring/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/tmp/tempo

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - tempo

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  tempo-data:
  grafana-data:
