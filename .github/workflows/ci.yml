name: GenTrip CI

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e "./backend[dev]"
      - run: python -m pytest backend/tests -m "not runtime_integration" -q
      - run: python scripts/evaluate_route_plans.py --json-output .runtime_logs/quality-gate.json
      - run: python scripts/evaluate_route_plans.py --blueprint-enabled --json-output .runtime_logs/quality-gate-blueprint.json

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  compose-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.production.yml -f docker-compose.demo.yml config --quiet
